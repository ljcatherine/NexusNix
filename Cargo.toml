[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.13"
edition = "2024"
license = "LicenseRef-Proprietary"
authors = ["Liam Catherine"]
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
time = { version = "0.3", features = ["formatting", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
tracing = "0.1"
tempfile = "3"
nexus-core = { path = "crates/nexus-core" }
nexus-access = { path = "crates/nexus-access" }
nexus-security = { path = "crates/nexus-security" }
nexus-telemetry = { path = "crates/nexus-telemetry" }
nexus-workspaces = { path = "crates/nexus-workspaces" }
nexus-git = { path = "crates/nexus-git" }
nexus-context = { path = "crates/nexus-context" }
nexus-providers = { path = "crates/nexus-providers" }
nexus-agents = { path = "crates/nexus-agents" }
nexus-ssh = { path = "crates/nexus-ssh" }
nexus-terminal = { path = "crates/nexus-terminal" }
nexus-ide = { path = "crates/nexus-ide" }
nexus-ui = { path = "crates/nexus-ui" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2
